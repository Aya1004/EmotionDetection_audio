version: "3.9"

services:
  api:
    build: .
    container_name: emotion-api
    ports:
      - "8000:8000"
    volumes:
      - ./tmp_uploads:/app/tmp_uploads
    restart: always

  frontend:
    build: ./emotion-ui
    container_name: emotion-ui
    ports:
      - "5173:5173"
    volumes:
      - ./emotion-ui:/app
      - /app/node_modules
    depends_on:
      - api
    restart: always